<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ecossistema Empresa Produtiva</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#1a2b47">
<meta name="apple-mobile-web-app-title" content="Empresa Produtiva">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceef2;
  --surface:#ffffff;
  --surface-2:#f6f7f9;
  --ink:#0b121f;
  --ink-soft:#4a5363;
  --line:#d5d9e0;
  --navy:#1a2b47;
  --navy-hover:#23385c;
  --vinho:#721035;
  --vinho-hover:#8a1a44;
  --telha:#a6280c;
  --telha-hover:#bd3616;
  --laranja:#c14b21;
  --on-dark:#ffffff;
  --on-dark-soft:rgba(255,255,255,.72);
  --ok:#2e7a57;
  --wip:#c14b21;
  --todo:#8a93a3;
  --none:#c3c8d1;
  --focus:#c14b21;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b121f;
    --surface:#141d2e;
    --surface-2:#1a2438;
    --ink:#eef1f6;
    --ink-soft:#a8b1c2;
    --line:#2a3650;
    --navy:#243b61;
    --navy-hover:#2d4874;
    --vinho:#8a1a44;
    --vinho-hover:#a02452;
    --telha:#b33216;
    --telha-hover:#c9401f;
    --ok:#48a37a;
    --todo:#7c8698;
    --none:#465169;
    --focus:#e0754c;
  }
}
:root[data-theme="dark"]{
  --bg:#0b121f;
  --surface:#141d2e;
  --surface-2:#1a2438;
  --ink:#eef1f6;
  --ink-soft:#a8b1c2;
  --line:#2a3650;
  --navy:#243b61;
  --navy-hover:#2d4874;
  --vinho:#8a1a44;
  --vinho-hover:#a02452;
  --telha:#b33216;
  --telha-hover:#c9401f;
  --ok:#48a37a;
  --todo:#7c8698;
  --none:#465169;
  --focus:#e0754c;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Poppins", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  font-size:16px;
  line-height:1.55;
  overflow-x:hidden;
}
img{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:36px 24px 72px}

/* cabeçalho */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.brand h1{font-size:clamp(2rem,4.6vw,3.2rem);line-height:1.05;margin:0;font-weight:700;letter-spacing:-.02em}
.brand p{margin:.5rem 0 0;color:var(--ink-soft);font-size:1rem;max-width:56ch}
.sync{font-size:.82rem;color:var(--ink-soft);display:flex;align-items:center;gap:.5rem}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--none);display:inline-block}
.sync.on i{background:var(--ok)}

/* cards de números */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:40px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
.stat b{display:block;font-size:2.1rem;line-height:1.1;font-weight:600}
.stat span{display:block;color:var(--ink-soft);font-size:.88rem;margin-top:4px}

h2.sec{font-size:1.15rem;font-weight:600;margin:0 0 14px}
.sec-note{color:var(--ink-soft);font-size:.9rem;margin:-8px 0 16px}

/* botões grandes */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:40px}
.tile{
  position:relative;text-align:left;border:0;cursor:pointer;
  background:var(--navy);color:var(--on-dark);
  border-radius:4px;padding:20px 20px 22px;min-height:170px;
  display:flex;flex-direction:column;gap:6px;
  transition:background-color .15s ease;
}
.tile:hover{background:var(--navy-hover)}
.tile.vinho{background:var(--vinho)}
.tile.vinho:hover{background:var(--vinho-hover)}
.tile.telha{background:var(--telha)}
.tile.telha:hover{background:var(--telha-hover)}
.tile .t-name{font-size:1.2rem;font-weight:600;line-height:1.25}
.tile .t-sub{font-size:.88rem;color:var(--on-dark-soft)}
.tile .t-phase{margin-top:auto;font-size:.88rem;font-weight:500}
.strip{position:absolute;left:0;right:0;bottom:0;height:8px;display:flex;gap:2px}
.strip i{flex:1;background:rgba(255,255,255,.18)}
.strip i.feito{background:#7fd1a8}
.strip i.andamento{background:#f0a07f}
.strip i.afazer{background:rgba(255,255,255,.42)}
.grid.duo{grid-template-columns:repeat(2,minmax(0,1fr))}

.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.84rem;color:var(--ink-soft);margin:-24px 0 36px}
.legend span{display:flex;align-items:center;gap:6px}

/* chips de status */
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.feito{background:var(--ok)}
.dot.andamento{background:var(--wip)}
.dot.afazer{background:var(--todo)}
.dot.semdado{background:transparent;border:2px dashed var(--none)}

/* navegação interna */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:18px;font-size:.92rem}
.crumbs button{background:none;border:0;padding:4px 2px;cursor:pointer;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px}
.crumbs button:hover{color:var(--ink)}
.crumbs .sep{color:var(--ink-soft)}
.head{border-left:6px solid var(--navy);padding:4px 0 4px 16px;margin-bottom:24px}
.head.vinho{border-color:var(--vinho)}
.head.telha{border-color:var(--telha)}
.head h2{margin:0;font-size:clamp(1.5rem,3vw,2.1rem);line-height:1.15;font-weight:700}
.head p{margin:.4rem 0 0;color:var(--ink-soft);max-width:70ch}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 24px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;min-width:160px}
.fact small{display:block;color:var(--ink-soft);font-size:.78rem}
.fact strong{font-weight:600}

/* botões de etapa */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:22px}
.steps.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.step{
  text-align:left;cursor:pointer;background:var(--surface);
  border:1px solid var(--line);border-left:6px solid var(--navy);
  border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-height:86px;
}
.step.vinho{border-left-color:var(--vinho)}
.step.telha{border-left-color:var(--telha)}
.step:hover{background:var(--surface-2)}
.step[aria-pressed="true"]{background:var(--navy);color:var(--on-dark);border-color:var(--navy)}
.step.vinho[aria-pressed="true"]{background:var(--vinho);border-color:var(--vinho)}
.step.telha[aria-pressed="true"]{background:var(--telha);border-color:var(--telha)}
.step .s-name{font-weight:600}
.step .s-status{display:flex;align-items:center;gap:6px;font-size:.84rem;color:var(--ink-soft)}
.step[aria-pressed="true"] .s-status{color:var(--on-dark-soft)}
.step[aria-pressed="true"] .dot.semdado{border-color:rgba(255,255,255,.6)}

/* painel da etapa */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px 24px}
.panel h3{margin:0 0 12px;font-size:1.25rem}
.status-pick{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.status-pick button{
  display:flex;align-items:center;gap:8px;cursor:pointer;
  background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:8px 12px;font-size:.9rem;
}
.status-pick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
.status-pick button:disabled{cursor:default;opacity:.65}
.hint{font-size:.82rem;color:var(--ink-soft);margin:-10px 0 16px}
.notes{margin:0 0 16px;padding-left:1.2rem;max-width:78ch}
.notes li{margin:.3rem 0}
.empty{color:var(--ink-soft);margin:0}

/* documentos */
details.doc{border:1px solid var(--line);border-radius:6px;margin:12px 0;background:var(--surface)}
details.doc > summary{cursor:pointer;padding:14px 16px;font-weight:600;display:flex;justify-content:space-between;gap:12px;list-style:none}
details.doc > summary::-webkit-details-marker{display:none}
details.doc > summary::after{content:"Abrir";font-weight:500;font-size:.85rem;color:var(--ink-soft);flex:none}
details.doc[open] > summary::after{content:"Fechar"}
details.doc[open] > summary{border-bottom:1px solid var(--line)}
.doc-body{padding:8px 22px 24px;max-width:80ch;line-height:1.7}
.doc-body table{border-collapse:collapse;font-size:.9rem}
.doc-body td,.doc-body th{border:1px solid var(--line);padding:8px;vertical-align:top}
.tablewrap{overflow-x:auto;max-width:100%}
.doc-body pre{overflow-x:auto;white-space:pre-wrap}
.doc-body a{color:var(--laranja)}
.doc-body p.h-like{font-weight:600}
.toc{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:10px 14px;margin:12px 0 18px}
.toc summary{cursor:pointer;font-weight:600;font-size:.92rem}
.toc ul{list-style:none;margin:8px 0 0;padding-left:0;max-height:320px;overflow:auto;font-size:.9rem}
.toc a{color:var(--ink)}
.toc li{margin:.15rem 0}
.toc li.sub{margin-left:1.2rem;font-size:.86rem}

.esteira{width:100%;border-collapse:collapse;font-size:.95rem}
.esteira th,.esteira td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.esteira th{font-weight:600;color:var(--ink-soft);font-size:.85rem}

@media (max-width:860px){
  .grid,.steps,.steps.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .wrap{padding:24px 14px 56px}
  .grid,.grid.duo,.steps,.steps.four{grid-template-columns:1fr}
  .tile{min-height:130px}
  .panel{padding:18px 14px}
  .doc-body{padding:8px 12px 20px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.sync,.legend{display:none}
.userbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.85rem;color:var(--ink-soft)}
.btn{cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 12px;font-size:.88rem;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--on-dark)}
.btn.primary:hover{background:var(--navy-hover)}
.btn.link{background:none;border:0;text-decoration:underline;text-underline-offset:3px;padding:8px 4px;color:var(--ink-soft)}
#import-msg{flex-basis:100%;text-align:right;margin:0;min-height:1.2em}
.aviso{background:#fbe9e3;color:#7a1f06;border:1px solid #e9b8a6;border-radius:6px;padding:12px 16px;margin:0 0 24px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .aviso{background:#3a1a12;color:#f5c9b8;border-color:#6b2c1a}}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--navy);border-radius:6px;padding:28px;width:100%;max-width:400px}
.login-card h1{margin:0 0 4px;font-size:1.8rem;line-height:1.1}
.login-card p{margin:0 0 20px;color:var(--ink-soft);font-size:.92rem}
.login-card label{display:block;font-size:.85rem;font-weight:500;margin:12px 0 4px}
input[type=email],input[type=password],input[type=text],input[type=url]{
  width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.login-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:18px}
.login-msg{min-height:1.4em;margin:12px 0 0!important;color:var(--ink)!important}
.carregando{min-height:60vh;display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.links{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.links h4{margin:0 0 8px;font-size:1rem}
.link-list{list-style:none;margin:0 0 12px;padding:0}
.link-list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.link-list a{color:var(--laranja);word-break:break-word}
.link-del{background:none;border:0;cursor:pointer;color:var(--ink-soft);text-decoration:underline;font-size:.85rem;flex:none}
.link-form{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;margin-top:10px}
@media (max-width:640px){.link-form{grid-template-columns:1fr}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="carregando" class="carregando">Carregando o painel...</div>

<div id="login" class="login" hidden>
  <form class="login-card" id="login-form">
    <h1>Empresa Produtiva</h1>
    <p>Entre com o seu e-mail e a sua senha para abrir o painel do ecossistema.</p>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" required>
    <div class="login-actions">
      <button type="submit" class="btn primary">Entrar</button>
      <button type="button" class="btn link" id="esqueci">Esqueci a senha</button>
    </div>
    <p class="login-msg" id="login-msg" aria-live="polite"></p>
  </form>
</div>

<div class="wrap" id="painel" hidden>
  <header class="top">
    <div class="brand">
      <h1>Empresa Produtiva</h1>
      <p>Painel do ecossistema: os produtos da esteira, a produção de conteúdo e as informações básicas da marca.</p>
    </div>
    <div class="userbar">
      <span id="quem"></span>
      <button type="button" class="btn" id="importar">Importar documentos</button>
      <button type="button" class="btn" id="sair">Sair</button>
      <input type="file" id="arquivo" accept="application/json,.json" hidden>
      <p id="import-msg" aria-live="polite"></p>
    </div>
  </header>
  <div class="aviso" id="aviso" role="alert" hidden></div>
  <main id="app"></main>
</div>

/* estado */
var overrides = {};
var links = {};
var fb = null;
var docCache = {};
var openDocs = {};

function key(scope, item, step){ return scope + ":" + item + ":" + step; }
function getStatus(scope, item, step, fallback){
  var k = key(scope, item, step);
  if (overrides[k] && STATUS[overrides[k]]) return overrides[k];
  return fallback || "semdado";
}
function productStatus(p, stepId){ return getStatus("p", p.id, stepId, p.defaults[stepId]); }
function channelStatus(c, stepId){ return getStatus("c", c.id, stepId, "semdado"); }

function setStatus(scope, item, step, value){
  var k = key(scope,item,step);
  overrides[k] = value;
  rerender();
  if (!fb) return;
  var patch = {}; patch[k] = value;
  fb.fs.setDoc(fb.fs.doc(fb.db,"painel","status"), {status: patch}, {merge:true}).catch(function(e){
    showError("O andamento não foi salvo. Confira a conexão e tente de novo. (" + ((e && e.code) || "erro") + ")");
  });
}

function linkList(k){ return Array.isArray(links[k]) ? links[k] : []; }
function saveLinks(k, arr){
  links[k] = arr;
  rerender();
  if (!fb) return;
  var patch = {}; patch[k] = arr;
  fb.fs.setDoc(fb.fs.doc(fb.db,"painel","links"), {links: patch}, {merge:true}).catch(function(e){
    showError("O link não foi salvo. Confira a conexão e tente de novo. (" + ((e && e.code) || "erro") + ")");
  });
}

function showError(text){
  var a = document.getElementById("aviso");
  a.textContent = text;
  a.hidden = false;
}

function phaseOf(p){
  if (productStatus(p,"paginas") === "feito" && productStatus(p,"editar") === "feito") return "No ar";
  if (productStatus(p,"paginas") === "feito") return "À venda";
  for (var i=0;i<PRODUCT_STEPS.length;i++){
    if (productStatus(p, PRODUCT_STEPS[i].id) === "andamento") return "Em andamento: " + PRODUCT_STEPS[i].label.toLowerCase();
  }
  var anyKnown = PRODUCT_STEPS.some(function(s){ return productStatus(p,s.id) !== "semdado"; });
  if (!anyKnown) return "Andamento sem informação";
  for (var j=0;j<PRODUCT_STEPS.length;j++){
    if (productStatus(p, PRODUCT_STEPS[j].id) === "afazer") return "Próxima etapa: " + PRODUCT_STEPS[j].label.toLowerCase();
  }
  return "Todas as etapas registradas";
}

/* utilidades */
function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(a){
    if (a === "class") n.className = attrs[a];
    else if (a === "text") n.textContent = attrs[a];
    else if (a.slice(0,2) === "on") n.addEventListener(a.slice(2), attrs[a]);
    else n.setAttribute(a, attrs[a]);
  });
  (kids||[]).forEach(function(k){ if (k != null) n.appendChild(typeof k === "string" ? document.createTextNode(k) : k); });
  return n;
}
function go(hash){ if (location.hash === hash) render(); else location.hash = hash; window.scrollTo(0,0); }
function route(){ return location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent); }

function crumbs(items){
  var c = el("nav", {class:"crumbs","aria-label":"Caminho"});
  items.forEach(function(it, i){
    if (i) c.appendChild(el("span",{class:"sep","aria-hidden":"true",text:"/"}));
    if (it[1] !== null) c.appendChild(el("button",{type:"button",text:it[0],onclick:function(){ go(it[1]); }}));
    else c.appendChild(el("span",{text:it[0]}));
  });
  return c;
}

function statusLine(st){
  return el("span",{class:"s-status"},[el("i",{class:"dot "+st,"aria-hidden":"true"}), STATUS[st].label]);
}

function strip(statuses){
  var s = el("span",{class:"strip","aria-hidden":"true"});
  statuses.forEach(function(st){ s.appendChild(el("i",{class:st})); });
  return s;
}

/* documentos */
function fetchDoc(k){
  if (docCache[k]) return Promise.resolve(docCache[k]);
  if (!fb) return Promise.reject(new Error("sem login"));
  return fb.fs.getDoc(fb.fs.doc(fb.db,"documentos",k)).then(function(s){
    if (!s.exists()) return null;
    docCache[k] = s.data();
    return docCache[k];
  });
}

function linksBlock(k){
  var box = el("div",{class:"links"});
  box.appendChild(el("h4",{text:"Arquivos no Google Drive"}));
  var arr = linkList(k);
  if (arr.length){
    var ul = el("ul",{class:"link-list"});
    arr.forEach(function(l, i){
      ul.appendChild(el("li",{},[
        el("a",{href:l.url,target:"_blank",rel:"noopener",text:l.titulo || l.url}),
        el("button",{type:"button",class:"link-del","aria-label":"Remover " + (l.titulo || l.url),text:"Remover",onclick:function(){
          if (!window.confirm("Remover o link " + (l.titulo || l.url) + "?")) return;
          var n = arr.slice(); n.splice(i,1); saveLinks(k, n);
        }})
      ]));
    });
    box.appendChild(ul);
  } else {
    box.appendChild(el("p",{class:"empty",text:"Nenhum link guardado aqui ainda."}));
  }
  var t = el("input",{type:"text",placeholder:"Nome do arquivo","aria-label":"Nome do arquivo"});
  var u = el("input",{type:"url",placeholder:"Endereço do arquivo no Google Drive","aria-label":"Endereço do arquivo"});

  var f = el("form",{class:"link-form",onsubmit:function(ev){
    ev.preventDefault();
    var url = u.value.trim();
    if (!/^https:\/\//i.test(url)){ msg.textContent = "Cole um endereço que comece com https://."; return; }
    saveLinks(k, arr.concat([{titulo: t.value.trim() || url, url: url}]));
  }},[t, u, el("button",{type:"submit",class:"btn",text:"Guardar link"})]);
  box.appendChild(f);
  box.appendChild(msg);
  return box;
}

function docBlock(keyName, title, open){
  var d = el("details",{class:"doc"});
  d.appendChild(el("summary",{},[el("span",{text:title})]));
  var body = el("div",{class:"doc-body"});
  d.appendChild(body);
  var loaded = false;
  function load(){
    if (loaded) return; loaded = true;
    if (docCache[keyName]) { fill(docCache[keyName]); return; }
    var wait = el("p",{class:"empty",text:"Carregando o documento..."});
    body.appendChild(wait);
    fetchDoc(keyName).then(function(data){
      wait.remove();
      fill(data);
    }).catch(function(){
      wait.textContent = "Não foi possível carregar o documento. Confira a conexão, feche e abra de novo.";
      loaded = false;
    });
  }
  function fill(data){
    if (!data || !data.html){
      body.appendChild(el("p",{class:"empty",text:"Este documento ainda não foi importado. Use o botão Importar documentos, no topo do painel."}));
      return;
    }
    var tpl = document.createElement("template");
    tpl.innerHTML = data.html;
    var frag = tpl.content;
    frag.querySelectorAll("table").forEach(function(t){
      var w = el("div",{class:"tablewrap"}); t.parentNode.insertBefore(w,t); w.appendChild(t);
    });
    frag.querySelectorAll("a[href]").forEach(function(a){ a.setAttribute("target","_blank"); a.setAttribute("rel","noopener"); });
    var holder = el("div");
    holder.appendChild(frag);
    var heads = [];
    var n = 0;
    holder.querySelectorAll("h1, h2, h3, p").forEach(function(node){
      var txt = node.textContent.replace(/\s+/g," ").trim();
      var isHead = /^H[123]$/.test(node.tagName);
      var level = node.tagName === "H3" ? 2 : 1;
      if (!isHead){
        var strong = node.firstElementChild;
        var isBold = strong && strong.tagName === "STRONG" && node.textContent.trim() === strong.textContent.trim();
        var pattern = /^(Módulo|Parte|Capítulo|Aula) [\d.]+[:.]/.test(txt);
        if (!isBold && !(pattern && txt.length <= 120)) return;
        if (/^(Módulo|Parte)\b/.test(txt)) level = 1;
        else if (/^(Capítulo|Aula)\b/.test(txt)) level = 2;
        else return;
        if (!isBold) node.classList.add("h-like");
      } else if (node.tagName === "H2" && heads.some(function(h){return h.tag==="H1";})) level = 2;
      if (!txt || txt.length > 140) return;
      var id = "sec-" + keyName + "-" + (n++);
      node.id = id;
      heads.push({id:id, txt:txt, level:level, tag:node.tagName});
    });
    if (heads.length >= 4){
      var ol = el("ul");
      heads.forEach(function(h){
        var a = el("a",{href:"#",text:h.txt,onclick:function(ev){ ev.preventDefault(); var t=document.getElementById(h.id); if (t) t.scrollIntoView({block:"start"}); }});
        ol.appendChild(el("li",{class:h.level===2?"sub":""},[a]));
      });
      body.appendChild(el("details",{class:"toc"},[el("summary",{text:"Índice ("+heads.length+" seções)"}), ol]));
    }
    body.appendChild(holder);
  }
  d.addEventListener("toggle", function(){ openDocs[keyName] = d.open; if (d.open) load(); });
  var shouldOpen = Object.prototype.hasOwnProperty.call(openDocs, keyName) ? openDocs[keyName] : open;
  if (shouldOpen){ d.open = true; load(); }
  return d;
}

function stepPanel(tone, steps, stepId, getSt, setSt, etapas){
  var wrap = el("div");
  var grid = el("div",{class:"steps"+(steps.length===4?" four":""),role:"group","aria-label":"Etapas"});
  steps.forEach(function(s){
    grid.appendChild(el("button",{type:"button",class:"step "+tone,"aria-pressed":String(s.id===stepId),onclick:function(){ setSt.navigate(s.id); }},[
      el("span",{class:"s-name",text:s.label}),
      statusLine(getSt(s.id))
    ]));
  });
  wrap.appendChild(grid);

  var step = steps.filter(function(s){ return s.id===stepId; })[0];
  if (!step){
    wrap.appendChild(el("p",{class:"empty",text:"Escolha uma etapa para ver o andamento e o material."}));
    return wrap;
  }
  var cur = getSt(step.id);
  var panel = el("section",{class:"panel","aria-live":"polite"});
  panel.appendChild(el("h3",{text:step.label}));
  var pick = el("div",{class:"status-pick",role:"group","aria-label":"Andamento da etapa"});
  STATUS_ORDER.forEach(function(k){
    var b = el("button",{type:"button","aria-pressed":String(k===cur),onclick:function(){ if (k!==cur) setSt.status(step.id,k); }},[el("i",{class:"dot "+k,"aria-hidden":"true"}), STATUS[k].label]);
    pick.appendChild(b);
  });
  panel.appendChild(pick);

  var info = etapas && etapas[step.id];
  var has = false;
  if (info && info.notas && info.notas.length){ panel.appendChild(notesList(info.notas)); has = true; }
  if (info && info.docs){ info.docs.forEach(function(d, i){ panel.appendChild(docBlock(d[0], d[1], i===0 && info.docs.length===1)); }); has = true; }
  if (!has) panel.appendChild(el("p",{class:"empty",text:"Ainda não há material nem orientação registrada para esta etapa."}));
  panel.appendChild(linksBlock(setSt.linkKey(step.id)));
  wrap.appendChild(panel);
  return wrap;
}

function viewProduct(app, id, stepId){
  var p = PRODUCTS.filter(function(x){ return x.id===id; })[0];
  if (!p){ go("#/"); return; }
  app.appendChild(crumbs([["Painel","#/"],[p.nome,null]]));
  app.appendChild(el("div",{class:"head"},[el("h2",{text:p.nome}), el("p",{text:p.resumo})]));
  var facts = el("div",{class:"facts"});
  p.fatos.forEach(function(f){ facts.appendChild(el("div",{class:"fact"},[el("small",{text:f[0]}), el("strong",{text:f[1]})])); });
  facts.appendChild(el("div",{class:"fact"},[el("small",{text:"Situação"}), el("strong",{text:phaseOf(p)})]));
  app.appendChild(facts);
  app.appendChild(stepPanel("", PRODUCT_STEPS, stepId,
    function(s){ return productStatus(p,s); },
    {navigate:function(s){ go("#/produto/"+p.id+"/"+s); }, status:function(s,v){ setStatus("p",p.id,s,v); }, linkKey:function(s){ return key("p",p.id,s); }},
    p.etapas));
}

function viewContentHome(app){
  app.appendChild(crumbs([["Painel","#/"],["Produção de conteúdo",null]]));
  app.appendChild(el("div",{class:"head vinho"},[el("h2",{text:"Produção de conteúdo"}), el("p",{text:"As 6 frentes de conteúdo, cada uma com as etapas de escrita, revisão, gravação e edição."})]));
  var g = el("section",{class:"grid"});
  CHANNELS.forEach(function(c){
    g.appendChild(el("button",{type:"button",class:"tile vinho",onclick:function(){ go("#/conteudo/"+c.id); }},[
      el("span",{class:"t-name",text:c.nome}),
      el("span",{class:"t-sub",text:c.sub})
    ]));
  });
  app.appendChild(g);
}

function viewChannel(app, id, stepId){
  var c = CHANNELS.filter(function(x){ return x.id===id; })[0];
  if (!c){ go("#/conteudo"); return; }
  app.appendChild(crumbs([["Painel","#/"],["Produção de conteúdo","#/conteudo"],[c.nome,null]]));
  app.appendChild(el("div",{class:"head vinho"},[el("h2",{text:c.nome}), el("p",{text:c.sub})]));
  app.appendChild(stepPanel("vinho", CONTENT_STEPS, stepId,
    function(s){ return channelStatus(c,s); },
    {navigate:function(s){ go("#/conteudo/"+c.id+"/"+s); }, status:function(s,v){ setStatus("c",c.id,s,v); }, linkKey:function(s){ return key("c",c.id,s); }},
    c.etapas));
}

function viewInfoHome(app){
  app.appendChild(crumbs([["Painel","#/"],["Informações básicas",null]]));
  app.appendChild(el("div",{class:"head telha"},[el("h2",{text:"Informações básicas"}), el("p",{text:"O material de base sobre você, a Empresa Produtiva, o posicionamento, a persona e a esteira."})]));
  var g = el("section",{class:"grid"});
  INFO.forEach(function(it){
    g.appendChild(el("button",{type:"button",class:"tile telha",onclick:function(){ go("#/info/"+it.id); }},[
      el("span",{class:"t-name",text:it.nome}),
      el("span",{class:"t-sub",text:it.sub})
    ]));
  });
  app.appendChild(g);
}

function viewInfo(app, id){
  var it = INFO.filter(function(x){ return x.id===id; })[0];
  if (!it){ go("#/info"); return; }
  app.appendChild(crumbs([["Painel","#/"],["Informações básicas","#/info"],[it.nome,null]]));
  app.appendChild(el("div",{class:"head telha"},[el("h2",{text:it.nome}), el("p",{text:it.sub})]));
  var panel = el("section",{class:"panel"});
  if (it.notas) panel.appendChild(notesList(it.notas));
  if (it.esteira){
    var wrapT = el("div",{class:"tablewrap"});
    var t = el("table",{class:"esteira"});
    t.appendChild(el("thead",{},[el("tr",{},[el("th",{text:"Produto"}),el("th",{text:"Formato"}),el("th",{text:"Preço"}),el("th",{text:"Situação"})])]));
    var tb = el("tbody");
    PRODUCTS.forEach(function(p){
      tb.appendChild(el("tr",{},[
        el("td",{},[el("button",{type:"button",class:"linkish",style:"background:none;border:0;padding:0;cursor:pointer;text-align:left;font-weight:600;text-decoration:underline;text-underline-offset:3px",text:p.nome,onclick:function(){ go("#/produto/"+p.id); }})]),
        el("td",{text:p.sub}),
        el("td",{text:p.fatos.filter(function(f){return /Preço|meses|Retorno|Versões/.test(f[0]);}).map(function(f){ return f[0]==="Preço"?f[1]:f[0]+": "+f[1]; }).join("; ")}),
        el("td",{text:phaseOf(p)})
      ]));
    });
    t.appendChild(tb); wrapT.appendChild(t); panel.appendChild(wrapT);
  }
  if (it.docs) it.docs.forEach(function(d, i){ panel.appendChild(docBlock(d[0], d[1], i===0 && it.docs.length===1)); });
  panel.appendChild(linksBlock("i:" + it.id));
  app.appendChild(panel);
}

function render(){
  var app = document.getElementById("app");
  app.innerHTML = "";
  var r = route();
  if (r[0]==="produto") viewProduct(app, r[1], r[2]);
  else if (r[0]==="conteudo" && r[1]) viewChannel(app, r[1], r[2]);
  else if (r[0]==="conteudo") viewContentHome(app);
  else if (r[0]==="info" && r[1]) viewInfo(app, r[1]);
  else if (r[0]==="info") viewInfoHome(app);
  else viewHome(app);
}

function rerender(){
  if (document.getElementById("painel").hidden) return;
  var y = window.scrollY;
  render();
  window.scrollTo(0, y);
}

window.addEventListener("hashchange", function(){ if (!document.getElementById("painel").hidden) render(); });

function clean(obj, check){
  var out = {};
  if (obj && typeof obj === "object"){
    Object.keys(obj).forEach(function(k){ if (check(obj[k])) out[k] = obj[k]; });
  }
  return out;
}

onAuthStateChanged(auth, function(user){
  unsubs.forEach(function(u){ u(); });
  unsubs = [];
  carregando.hidden = true;
  if (!user){
    fb = null; overrides = {}; links = {}; docCache = {}; openDocs = {};
    painel.hidden = true;
    loginBox.hidden = false;
    return;
  }
  fb = {db: db, fs: fsApi};
  loginBox.hidden = true;
  painel.hidden = false;
  document.getElementById("quem").textContent = user.email || "";
  document.getElementById("aviso").hidden = true;
  render();
  function denied(e){
    if (e && e.code === "permission-denied") showError("Este login não tem permissão para ler o painel. Confira se o UID nas regras do Firestore é o do seu usuário.");
    else showError("Não foi possível ler os dados do painel. Confira a conexão e recarregue a página.");
  }
  unsubs.push(onSnapshot(doc(db,"painel","status"), function(s){
    var d = s.exists() ? s.data() : null;
    overrides = clean(d && d.status, function(v){ return typeof v === "string" && !!STATUS[v]; });
    rerender();
  }, denied));
  unsubs.push(onSnapshot(doc(db,"painel","links"), function(s){
    var d = s.exists() ? s.data() : null;
    links = clean(d && d.links, function(v){ return Array.isArray(v); });
    rerender();
  }, denied));
});

document.getElementById("login-form").addEventListener("submit", function(ev){
  ev.preventDefault();
  var email = document.getElementById("email").value.trim();
  var senha = document.getElementById("senha").value;
  loginMsg.textContent = "Entrando...";
  signInWithEmailAndPassword(auth, email, senha).then(function(){
    loginMsg.textContent = "";
    document.getElementById("senha").value = "";
  }).catch(function(e){
    var c = e && e.code;
    if (c === "auth/invalid-credential" || c === "auth/wrong-password" || c === "auth/user-not-found" || c === "auth/invalid-email") loginMsg.textContent = "E-mail ou senha incorretos.";
    else if (c === "auth/too-many-requests") loginMsg.textContent = "Muitas tentativas seguidas. Espere alguns minutos e tente de novo.";
    else loginMsg.textContent = "Não foi possível entrar. Confira a conexão e tente de novo.";
  });
});

document.getElementById("esqueci").addEventListener("click", function(){

  if (!email){ loginMsg.textContent = "Digite o seu e-mail acima e clique de novo em Esqueci a senha."; return; }
  sendPasswordResetEmail(auth, email).then(function(){

  }).catch(function(){

});

var arquivo = document.getElementById("arquivo");
var importMsg = document.getElementById("import-msg");
document.getElementById("importar").addEventListener("click", function(){ arquivo.click(); });
arquivo.addEventListener("change", function(){
  var f = arquivo.files && arquivo.files[0];
  arquivo.value = "";
  if (!f || !fb) return;
  f.text().then(function(txt){
    var data;
    try { data = JSON.parse(txt); } catch(e){ importMsg.textContent = "Esse arquivo não é o documentos.json. Escolha o arquivo certo."; return; }
    var keys = Object.keys(data || {}).filter(function(k){ return /^[a-z0-9_]+$/i.test(k) && data[k] && typeof data[k].html === "string"; });
    if (!keys.length){ importMsg.textContent = "Nenhum documento encontrado nesse arquivo."; return; }
    if (!window.confirm("Importar " + keys.length + " documentos? Os documentos com o mesmo nome no painel serão substituídos.")) return;
    var i = 0;
    function next(){
      if (i >= keys.length){
        docCache = {};
        importMsg.textContent = keys.length + " documentos importados.";
        rerender();
        return Promise.resolve();
      }
      var k = keys[i];
      importMsg.textContent = "Importando " + (i + 1) + " de " + keys.length + "...";
      var html = data[k].html.replace(/<script[\s\S]*?<\/script>/gi, "");
      return setDoc(doc(db,"documentos",k), {titulo: String(data[k].titulo || k), html: html, atualizado: serverTimestamp()}).then(function(){ i++; return next(); });
    }
    next().catch(function(e){
      importMsg.textContent = "A importação parou no documento " + (i + 1) + ". Confira a conexão e importe de novo. (" + ((e && e.code) || "erro") + ")";
    });
  });
});
